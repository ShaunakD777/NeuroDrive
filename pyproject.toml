[project]
name = "neurodrive"
version = "0.1.0"
description = "A 2D racing simulator whose cars are driven by neural networks, built to learn how learning algorithms work."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=17.2",
]

[project.scripts]
nd = "neurodrive.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurodrive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W: style errors and warnings, F: real bugs (undefined names, unused imports),
# I: import order, UP: modern Python syntax, B: likely-bug patterns.
select = ["E", "W", "F", "I", "UP", "B"]
