# Toy task "sine": fit y = sin(x) on [-pi, pi] with one hidden layer of 16 tanh neurons
# (task 3.7 defaults). Train:  uv run python -m neurodrive train --config configs/toy_sine.yaml
# Success: loss below 0.01. To try Adam, replace the optimizer section with
#   optimizer: {name: adam, learning_rate: 0.01}
# Format: docs/ARCHITECTURE.md section 6.15 (config v1, ADR-032).
method: toy
task: sine
seed: 0
tag: default
network:
  layer_sizes: [1, 16, 1]
  hidden_activation: tanh
  output_activation: linear
  init_scheme: xavier
training:
  epochs: 3000
  loss: mse
  batch_size: null      # null = full batch (all examples in one step)
  val_fraction: 0.0     # share of examples held back for validation
optimizer:
  name: sgd             # sgd, momentum, rmsprop or adam
  learning_rate: 0.05
