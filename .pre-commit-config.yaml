# Checks that run on every `git commit` (ADR-014). Install once per clone:
#   uv run python -m pre_commit install
# Run on every file by hand:
#   uv run python -m pre_commit run --all-files
# (The `python -m` form works even where Windows Smart App Control blocks the pre-commit.exe
# launcher.) Never bypass a failing hook with --no-verify: fix the cause instead.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    # Every hook here runs through Python instead of its generated .exe launcher: Windows Smart
    # App Control judges each launcher by its own file hash and blocks some of them
    # ([WinError 4551]; detect-private-key first, trailing-whitespace-fixer since 2026-10-25).
    # Same check, same code.
    hooks:
      - id: check-added-large-files
        entry: python -m pre_commit_hooks.check_added_large_files
        args: [--maxkb=1000]
      - id: detect-private-key
        entry: python -m pre_commit_hooks.detect_private_key
      - id: end-of-file-fixer
        entry: python -m pre_commit_hooks.end_of_file_fixer
      - id: trailing-whitespace
        entry: python -m pre_commit_hooks.trailing_whitespace_fixer
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        entry: python -m pre_commit_hooks.check_yaml

  # Secret scan before every commit. detect-secrets is written in Python, so it runs through Python
  # like the hook above; Windows Smart App Control blocks compiled hook programs such as the
  # gitleaks one ([WinError 4551], ADR-021). gitleaks still scans the whole history in CI on every
  # push. Known non-secrets are listed in .secrets.baseline (currently none).
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        entry: python -m detect_secrets.pre_commit_hook
        args: [--baseline, .secrets.baseline]
        exclude: (^|/)(uv\.lock|package-lock\.json)$|^web/src/api/generated\.ts$

  # Ruff runs through uv so the hook uses exactly the ruff version pinned in uv.lock, the same
  # one CI uses. A separate ruff hook repository would pin a second version that could disagree.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
